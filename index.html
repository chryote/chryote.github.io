<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Catalogue - chryote</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --border-color: #d0d7de;
      --accent: #0969da;
      --accent-light: #ddf4ff;
      --accent-border: rgba(9, 105, 218, 0.25);
      --poc-bg: #eff6ff;
      --poc-text: #1d4ed8;
      --poc-border: #bfdbfe;
      --lab-bg: #fdf2f8;
      --lab-text: #9d174d;
      --lab-border: #fbcfe8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      line-height: 1.5;
    }

    header {
      margin-bottom: 1.75rem;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Filter Tabs Bar */
    .filter-bar {
      margin-bottom: 2rem;
    }

    .filter-tabs {
      display: inline-flex;
      gap: 0.35rem;
      background: #eaeef2;
      padding: 0.35rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(140, 149, 159, 0.2);
    }

    .tab-count {
      font-size: 0.75rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.08);
      font-weight: 500;
    }

    .tab-btn.active .tab-count {
      background: #f1f3f5;
      color: var(--text-primary);
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(140, 149, 159, 0.18);
      border-color: #0969da88;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .category-badge {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .badge-poc {
      background: var(--poc-bg);
      color: var(--poc-text);
      border: 1px solid var(--poc-border);
    }

    .badge-lab {
      background: var(--lab-bg);
      color: var(--lab-text);
      border: 1px solid var(--lab-border);
    }

    .card h3 {
      margin: 0;
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: 600;
      word-break: break-word;
    }

    .badge-framework {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card p {
      flex-grow: 1;
      color: var(--text-secondary);
      font-size: 0.88rem;
      line-height: 1.5;
      margin: 0 0 1rem 0;
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .tech-tag {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      background: #f1f3f5;
      color: #495057;
      border: 1px solid #e9ecef;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
      border-top: 1px solid #f0f2f5;
      padding-top: 0.75rem;
      margin-top: auto;
    }

    .lang-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .github-link-icon {
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }

    .card:hover .github-link-icon {
      opacity: 1;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
      background: white;
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <h1>Project Catalogue</h1>
    <p class="subtitle">A showcase of public open-source projects, frameworks, and proofs of concept.</p>
  </header>

  <!-- Interactive Category Tabs -->
  <div class="filter-bar">
    <div class="filter-tabs" role="tablist">
      <button class="tab-btn active" data-filter="all" role="tab" aria-selected="true">
        All <span class="tab-count" id="count-all">0</span>
      </button>
      <button class="tab-btn" data-filter="poc" role="tab" aria-selected="false">
        Professional POCs <span class="tab-count" id="count-poc">0</span>
      </button>
      <button class="tab-btn" data-filter="lab" role="tab" aria-selected="false">
        Lab <span class="tab-count" id="count-lab">0</span>
      </button>
    </div>
  </div>
  
  <div class="grid" id="portfolio">
    <!-- Repositories will load here -->
  </div>

  <script>
    const username = 'chryote';

    // Curated framework and tech stack metadata for known projects
    const projectRegistry = {
      'project_compvis': {
        framework: 'Flask',
        stack: ['Flask', 'PyTorch', 'OpenCV', 'Gunicorn']
      },
      'project_rag': {
        framework: 'Gin (Go)',
        stack: ['Gin', 'Go 1.27', 'Sonic JSON', 'RAG']
      },
      'project_m2m': {
        framework: 'gRPC (C++)',
        stack: ['gRPC', 'Protobuf', 'C++17', 'Conan', 'CMake']
      },
      'project_ocr': {
        framework: 'FastAPI',
        stack: ['FastAPI', 'Tesseract OCR', 'OpenCV', 'Pydantic v2']
      },
      'project_scrapper': {
        framework: 'Express & Playwright',
        stack: ['Express 5', 'Playwright', 'Node.js', 'XLSX']
      },
      'project_digiflazz': {
        framework: 'Laravel',
        stack: ['Laravel 13', 'PHP 8.3', 'Sanctum', 'Prometheus']
      },
      'text-rpg': {
        framework: 'Custom Sim Engine',
        stack: ['Python', 'Curses', 'Perlin Noise', 'Matplotlib']
      }
    };

    // GitHub language color palette
    const langColors = {
      'Python': '#3572A5',
      'Go': '#00ADD8',
      'C++': '#f34b7d',
      'JavaScript': '#f1e05a',
      'TypeScript': '#3178c6',
      'PHP': '#4F5D95',
      'HTML': '#e34c26',
      'Shell': '#89e051',
      'Other': '#8b949e'
    };

    // Classification rule: Repositories with 'project_' prefix are Professional POCs, all others belong to 'Lab'
    function isPoc(repo) {
      return repo.name.toLowerCase().startsWith('project_');
    }

    // Heuristic detection fallback for future/unregistered repositories
    function detectFramework(repo) {
      if (projectRegistry[repo.name]) {
        return projectRegistry[repo.name];
      }

      const text = `${repo.name} ${repo.description || ''} ${(repo.topics || []).join(' ')}`.toLowerCase();
      
      let framework = 'Custom / Native';
      let stack = [];

      if (text.includes('fastapi')) framework = 'FastAPI';
      else if (text.includes('flask')) framework = 'Flask';
      else if (text.includes('django')) framework = 'Django';
      else if (text.includes('gin')) framework = 'Gin';
      else if (text.includes('grpc')) framework = 'gRPC';
      else if (text.includes('laravel')) framework = 'Laravel';
      else if (text.includes('express')) framework = 'Express';
      else if (text.includes('next')) framework = 'Next.js';
      else if (text.includes('react')) framework = 'React';
      else if (text.includes('vue')) framework = 'Vue';
      else if (repo.language) framework = `${repo.language} App`;

      if (repo.language) stack.push(repo.language);

      return { framework, stack };
    }

    let loadedRepos = [];
    let activeFilter = 'all';

    function updateCounts() {
      const pocCount = loadedRepos.filter(isPoc).length;
      const labCount = loadedRepos.filter(r => !isPoc(r)).length;

      document.getElementById('count-all').textContent = loadedRepos.length;
      document.getElementById('count-poc').textContent = pocCount;
      document.getElementById('count-lab').textContent = labCount;
    }

    function renderFilteredRepos() {
      const container = document.getElementById('portfolio');
      container.innerHTML = '';

      let reposToRender = loadedRepos;
      if (activeFilter === 'poc') {
        reposToRender = loadedRepos.filter(isPoc);
      } else if (activeFilter === 'lab') {
        reposToRender = loadedRepos.filter(r => !isPoc(r));
      }

      if (reposToRender.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No repositories found in this section.</p></div>`;
        return;
      }

      reposToRender.forEach(repo => {
        const meta = detectFramework(repo);
        const isProfessional = isPoc(repo);
        const categoryLabel = isProfessional ? 'Professional POC' : 'Lab';
        const categoryClass = isProfessional ? 'badge-poc' : 'badge-lab';

        const lang = repo.language || 'Other';
        const color = langColors[lang] || langColors['Other'];

        const tagsHtml = meta.stack && meta.stack.length > 0 
          ? `<div class="tech-tags">${meta.stack.map(tag => `<span class="tech-tag">${tag}</span>`).join('')}</div>`
          : '';

        const card = document.createElement('a');
        card.className = 'card';
        card.href = repo.html_url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.innerHTML = `
          <div class="card-top">
            <div class="card-title-group">
              <span class="category-badge ${categoryClass}">${categoryLabel}</span>
              <h3>${repo.name}</h3>
            </div>
            <span class="badge-framework">${meta.framework}</span>
          </div>
          <p>${repo.description || 'No description provided.'}</p>
          ${tagsHtml}
          <div class="meta">
            <span class="lang-indicator">
              <span class="lang-dot" style="background-color: ${color};"></span>
              <span>${lang}</span>
            </span>
            <span class="github-link-icon" title="View repository">↗</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Bind tab click events
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        if (filter === activeFilter) return;

        activeFilter = filter;
        document.querySelectorAll('.tab-btn').forEach(b => {
          const isActive = b === btn;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        renderFilteredRepos();
      });
    });

    // Static fallback dataset in case GitHub unauthenticated API rate-limits
    const fallbackRepos = [
      {
        name: 'project_compvis',
        description: 'Flask API for computer vision POC',
        language: 'Python',
        html_url: 'https://github.com/chryote/project_compvis'
      },
      {
        name: 'project_rag',
        description: 'RAG and document post-processing Go backend service POC',
        language: 'Go',
        html_url: 'https://github.com/chryote/project_rag'
      },
      {
        name: 'project_m2m',
        description: 'M2M financial pipeline gRPC C++ POC',
        language: 'C++',
        html_url: 'https://github.com/chryote/project_m2m'
      },
      {
        name: 'project_ocr',
        description: 'KTP-to-JSON tesseract OCR for hotel check-in data gathering POC',
        language: 'Python',
        html_url: 'https://github.com/chryote/project_ocr'
      },
      {
        name: 'project_scrapper',
        description: 'POC for hotel price scrapper',
        language: 'JavaScript',
        html_url: 'https://github.com/chryote/project_scrapper'
      },
      {
        name: 'project_digiflazz',
        description: 'Live and mock Digiflazz API gateway implementation POC',
        language: 'PHP',
        html_url: 'https://github.com/chryote/project_digiflazz'
      },
      {
        name: 'text-rpg',
        description: 'A tag-driven, systemic storytelling engine where macro world events, trade interactions, tile-level dynamics, and entity-driven scenes combine to create an endlessly emergent narrative world.',
        language: 'Python',
        html_url: 'https://github.com/chryote/text-rpg'
      }
    ];

    // Fetch repositories sorted by most recently updated
    fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=30`)
      .then(response => {
        if (!response.ok) {
          throw new Error(`GitHub API returned status ${response.status}`);
        }
        return response.json();
      })
      .then(repos => {
        if (!Array.isArray(repos)) {
          throw new Error('Invalid response structure');
        }
        // Filter out forked repositories and this catalogue site repository
        loadedRepos = repos.filter(repo => 
          !repo.fork && repo.name.toLowerCase() !== `${username.toLowerCase()}.github.io`
        );
        updateCounts();
        renderFilteredRepos();
      })
      .catch(error => {
        console.warn('Falling back to curated project dataset:', error);
        loadedRepos = fallbackRepos;
        updateCounts();
        renderFilteredRepos();
      });
  </script>
</body>
</html>
